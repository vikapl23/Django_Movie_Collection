<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мій кінощоденник{% endblock %}</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
            color: #222;
        }
        h1 { color: #306998; }
        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #306998;
            font-weight: bold;
        }
        .item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .item a {
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }
        .tag {
            display: inline-block;
            background: #eef4fa;
            color: #306998;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.85em;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Головна</a>
        <a href="{% url 'movie_list' %}">Фільми</a>
        <a href="{% url 'genre_list' %}">Жанри</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
