{% extends 'movies/base.html' %}

{% block title %}Genres{% endblock %}

{% block content %}
    <h1>Genres</h1>

    {% for genre in genres %}
        <div class="card">
            <span class="card-title">{{ genre.name }}</span>
            <span class="badge" style="margin-left: 8px;">{{ genre.movies.count }} movie{{ genre.movies.count|pluralize }}</span>
        </div>
    {% empty %}
        <div class="empty-state">No genres yet.</div>
    {% endfor %}

    <a class="back-link" href="{% url 'home' %}">&larr; Back to home</a>
{% endblock %}
