{% extends 'movies/base.html' %}

{% block title %}Жанри{% endblock %}

{% block content %}
    <h1>Жанри</h1>

    {% for genre in genres %}
        <div class="card">
            <span class="card-title">{{ genre.name }}</span>
            <span class="badge" style="margin-left: 8px;">{{ genre.movies.count }} фільм(ів)</span>
        </div>
    {% empty %}
        <div class="empty-state">Жанрів ще немає.</div>
    {% endfor %}

    <a class="back-link" href="{% url 'home' %}">&larr; На головну</a>
{% endblock %}
