{% extends 'movies/base.html' %}

{% block title %}Зміна пароля{% endblock %}

{% block content %}
    <h1>Зміна пароля</h1>

    <div class="auth-box">
        <form method="post" class="styled-form">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Змінити пароль</button>
            </div>
        </form>
    </div>
{% endblock %}
